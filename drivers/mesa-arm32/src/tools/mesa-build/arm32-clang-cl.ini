# Meson cross file: Windows 10 Mobile ARM32 (arm-pc-windows-msvc = ARMv7 Thumb-2; meson lay /MACHINE tu day) bang clang-cl.
# INCLUDE/LIB lay tu vcvarsall x64_arm 10.0.16299.0 (VS 2017, MSVC 14.16) - xem build.cmd.
[binaries]
c = ['clang-cl', '--target=arm-pc-windows-msvc']
cpp = ['clang-cl', '--target=arm-pc-windows-msvc']
c_ld = 'lld-link'
cpp_ld = 'lld-link'
ar = 'llvm-lib'
windres = 'llvm-rc'

[built-in options]
c_args = ['-D_ARM_WINAPI_PARTITION_DESKTOP_SDK_AVAILABLE=1', '-DWINVER=0x0A00', '-D_WIN32_WINNT=0x0A00', '-Wno-microsoft-enum-forward-reference']
cpp_args = ['-D_ARM_WINAPI_PARTITION_DESKTOP_SDK_AVAILABLE=1', '-DWINVER=0x0A00', '-D_WIN32_WINNT=0x0A00']
c_link_args = ['/machine:arm']
cpp_link_args = ['/machine:arm']

[host_machine]
system = 'windows'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
